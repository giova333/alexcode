provider: anthropic
model: claude-sonnet-4-6
max_tokens: 8192

anthropic:
  api_key: "${ANTHROPIC_API_KEY}"

reasoning:
  enabled: true
  effort: high               # low, medium, high (adaptive thinking)
  show_thinking: true        # Display thinking output in the terminal

compaction:
  threshold_tokens: 80000
  keep_recent_messages: 10

memory:
  enabled: true
  memory_file: .agent/memory/MEMORY.md
  daily_dir: .agent/memory/daily/
  context_days: 2                # days of daily notes in system prompt
  index_on_startup: true         # index memory + recent history at startup

embedding:
  enabled: true
  model: all-MiniLM-L6-v2
  db_path: .agent/embeddings.db
  hybrid_alpha: 0.7
  chunk_size: 512
  chunk_overlap: 50

history:
  dir: .agent/history/
  index_enabled: true          # index session files (on startup and on save)

skills:
  dirs:
    - skills/

mcp_servers: []

tools:
  bash_timeout: 120
