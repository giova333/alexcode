provider: anthropic
model: claude-sonnet-4-6
max_tokens: 8192

anthropic:
  api_key: "${ANTHROPIC_API_KEY}"

reasoning:
  enabled: true
  effort: xhigh               # low, medium, high (adaptive thinking)
  show_thinking: true        # Display thinking output in the terminal

compaction:
  threshold_tokens: 80000
  keep_recent_messages: 10

memory:
  enabled: true
  memory_file: ~/.config/agent/MEMORY.md   # user-scoped; one file across all projects
  scope: global                            # "global" (cross-project) or "project" (this project only)

mem0:
  enabled: true
  project_store_dir: .agent/mem0/project/
  global_store_dir: ~/.config/agent/mem0/global/
  llm:
    provider: anthropic
    model: claude-haiku-4-5
    api_key: "${ANTHROPIC_API_KEY}"
  embedder:
    provider: openai
    model: text-embedding-3-small
    api_key: "${OPENAI_API_KEY}"

history:
  dir: .agent/history/

skills:
  dirs:
    - skills/

mcp_servers: []

tools:
  bash_timeout: 120
