[project]
name = "ai-agent"
version = "0.1.0"
description = "AI coding agent with tool use, memory, and MCP support"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.45.0",

    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "mcp>=1.0",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "tiktoken>=0.8",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "html2text>=2024.2",
]

[project.optional-dependencies]
embedding = [
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.12",
    "pytest-timeout>=2.2",
]

[project.scripts]
alexcode = "agent.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: Integration tests (may use filesystem, mock LLM APIs)",
    "slow: Tests that take more than a few seconds",
]
asyncio_mode = "auto"
timeout = 30
